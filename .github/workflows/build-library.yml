# Merges the imported lists (import/sources.json) into data/library.json, matching every series
# to MangaDex, MangaUpdates and AniList. Runs when the import file changes, or by hand.
name: Build library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["import/**", "scripts/build_library.py", ".github/workflows/build-library.yml"]

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/build_library.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Library rebuilt $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
