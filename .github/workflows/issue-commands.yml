# Adds or removes series when the website opens an "[add]" / "[remove]" issue.
# Only issues opened by the repository owner are processed.
name: Add or remove series

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  handle:
    if: github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[add]') || startsWith(github.event.issue.title, '[remove]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update library
        id: run
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/issue_command.py > reply.txt
          cat reply.txt
      - name: Save
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -m "$TITLE"
            git pull --rebase
            git push
          fi
      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file reply.txt
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
