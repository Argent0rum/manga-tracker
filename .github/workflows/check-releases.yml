# Looks for new chapters every two hours and saves them to docs/data/releases.json.
# Run by hand: Actions → "Check releases" → Run workflow.
name: Check releases

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */2 * * *"

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/check_releases.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "New releases $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
